<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Capivara IA</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .status {
      font-size: 12px;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .bot {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
    }
    .input-container {
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }
    textarea {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 10px;
      border-radius: 8px;
      resize: none;
      height: 44px;
      font-size: 15px;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 0 16px;
      height: 44px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <div>🦫 <strong>Capivara IA</strong> <span class="status">● Online</span></div>
    <button onclick="clearChat()" style="background:#334155; font-size:12px; padding:0 12px; height:32px;">Limpar</button>
  </header>

  <div id="chat-container"></div>

  <div class="input-container">
    <textarea id="user-input" placeholder="Digite sua mensagem..."></textarea>
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    const GROQ_API_KEY = "Sua_Chave_Groq_Aqui";

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const botMsgDiv = addMessage('Pensando...', 'bot');

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [{ role: 'user', content: text }]
          })
        });

        const data = await response.json();
        const reply = data.choices[0]?.message?.content || 'Sem resposta.';
        botMsgDiv.innerHTML = marked.parse(reply);
      } catch (err) {
        botMsgDiv.textContent = 'Erro ao conectar à IA.';
      }
    }

    function addMessage(text, sender) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function clearChat() {
      document.getElementById('chat-container').innerHTML = '';
    }
  </script>
</body>
</html>
