<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Capivara IA</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .status {
      font-size: 12px;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .bot {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
    }
    .message img {
      width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }
    .input-container {
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 10px;
      border-radius: 8px;
      resize: none;
      height: 48px;
      font-size: 15px;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      background: #22c55e;
      color: white;
      border: none;
      height: 40px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-img {
      background: #8b5cf6;
    }
    .btn-video {
      background: #e11d48;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <div>🦫 <strong>Capivara IA</strong> <span class="status">● Online</span></div>
    <button onclick="clearChat()" style="background:#334155; font-size:12px; padding:0 10px; height:32px; flex:none;">Limpar</button>
  </header>

  <div id="chat-container"></div>

  <div class="input-container">
    <textarea id="user-input" placeholder="Digite uma pergunta, pedido de imagem ou tema..."></textarea>
    <div class="btn-group">
      <button onclick="sendMessage()" title="Enviar Mensagem">💬 Chat</button>
      <button onclick="sendImagePrompt()" class="btn-img" title="Gerar Imagem">🖼️ Foto</button>
      <button onclick="sendVideoPrompt()" class="btn-video" title="Criar Roteiro de Vídeo">🎬 Vídeo</button>
    </div>
  </div>

  <script>
    const API_KEY = "Gsk_UlBwZUoMsAI1PutmE1STWGdyb3FYpdz0qs2woTFy0e033quY59ok";

    async function sendMessage(customPrompt = null) {
      const input = document.getElementById('user-input');
      const text = customPrompt || input.value.trim();
      if (!text) return;

      if (!customPrompt) {
        addMessage(text, 'user');
        input.value = '';
      }

      const botMsgDiv = addMessage('Pensando...', 'bot');

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [{ role: 'user', content: text }]
          })
        });

        const data = await response.json();
        const reply = data.choices[0]?.message?.content || 'Sem resposta.';
        botMsgDiv.innerHTML = marked.parse(reply);
      } catch (err) {
        botMsgDiv.textContent = 'Erro ao conectar à IA.';
      }
    }

    async function sendImagePrompt() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      addMessage("🖼️ Gerar imagem: " + text, 'user');
      input.value = '';

      const botMsgDiv = addMessage('Gerando foto...', 'bot');

      try {
        const encodedPrompt = encodeURIComponent(text);
        const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=768&height=768&nologo=true`;
        
        botMsgDiv.innerHTML = `Aqui está a sua imagem:<br><img src="${imageUrl}" alt="${text}" onload="scrollToBottom()">`;
      } catch (err) {
        botMsgDiv.textContent = 'Erro ao gerar a imagem.';
      }
    }

    function sendVideoPrompt() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      addMessage("🎬 Criar roteiro de vídeo: " + text, 'user');
      input.value = '';

      const videoPrompt = `Atue como um especialista em produção e roteiros de vídeos virais para YouTube/TikTok/Reels. Crie um roteiro completo, detalhado e altamente atraente sobre o seguinte tema: "${text}".
      
      Estruture a resposta em:
      1. 🎯 **Gancho Inicial (0 a 5 segundos)**
      2. 📜 **Roteiro Completo (Narração + Visual para cada cena)**
      3. 💡 **Prompts de Imagens/IA sugeridos para cada cena**
      4. 🏷️ **Títulos Virais e Tags recomendadas**`;

      sendMessage(videoPrompt);
    }

    function addMessage(text, sender) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      if(sender === 'user') {
        div.textContent = text;
      } else {
        div.innerHTML = text;
      }
      container.appendChild(div);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-container');
      container.scrollTop = container.scrollHeight;
    }

    function clearChat() {
      document.getElementById('chat-container').innerHTML = '';
    }
  </script>
</body>
</html>
